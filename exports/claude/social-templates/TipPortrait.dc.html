<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dirt Order tip, portrait</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>body{margin:0;font-synthesis:none}</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; position: relative; overflow: hidden; padding: 80px; background: #20150C; color: #F9F7F4; font-family: 'Source Sans 3', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between">
  <svg aria-hidden="true" width="1080" height="1350" style="position: absolute; left: 0; top: 0; opacity: 0.06; pointer-events: none"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="1080" height="1350" filter="url(#grain)"></rect></svg>
  <div style="position: relative; align-self: flex-start; background: #6F482A; padding: 3px; clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px)">
    <div style="background: #2E1D10; padding: 6px; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px)">
      <div style="border: 2px dashed #6F482A; padding: 12px 24px; font-family: Graduate, 'Rockwell Extra Bold', Rockwell, serif; font-weight: 400; text-transform: uppercase; font-size: 28px; letter-spacing: 0.08em; line-height: 1; color: #C8783A">Dirt Order #{{ n }}</div>
    </div>
  </div>
  <div style="position: relative; display: flex; flex-direction: column; gap: 32px">
    <h1 style="margin: 0; font-family: Graduate, 'Rockwell Extra Bold', Rockwell, serif; font-weight: 400; text-transform: uppercase; font-size: 80px; line-height: 1.1; color: #F9F7F4">{{ q }}</h1>
    <p style="margin: 0; font-size: 44px; line-height: 1.4; color: #F9F7F4">{{ a }}</p>
    <sc-if value="{{ hasExtra }}" hint-placeholder-val="{{ false }}">
      <p style="margin: 0; font-size: 36px; line-height: 1.4; color: #BFA89B">{{ extra }}</p>
    </sc-if>
    <sc-if value="{{ hasSource }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="font-size: 30px; line-height: 1.4; color: #BFA89B">Source: Tangipahoa Parish, [published culvert process], checked [date]</div>
        <div style="align-self: flex-start; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #2E1D10; border: 1px solid #E8A33D; border-radius: 2px; color: #E8A33D; font-weight: 700; font-size: 28px; letter-spacing: 0.04em; text-transform: uppercase"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24"><path fill="#E8A33D" d="M12 2 1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"></path></svg>Confirm before publishing</div>
      </div>
    </sc-if>
  </div>
  <div style="position: relative; font-size: 30px; color: #BFA89B">wrightco.llc</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tip":{"editor":"enum","options":["1","2","3","4","5","6","7"],"default":"1","section":"Content"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const tips = {
      '1': ['What comes first?', 'In Tangipahoa it’s your 911 address, then the culvert permit, then us: clear, driveway, pad.', ''],
      '2': ['Why does the culvert come first?', 'In Tangipahoa, the parish won’t start the culvert process without a 911 address, and installation can take up to 30 days after notice.', ''],
      '3': ['How high should my pad be?', 'Your surveyor and the parish set it. We build to it.', ''],
      '4': ['Do I need a permit to clear?', 'It depends on how much you clear. We’ll tell you what applies to your lot. The application is yours to file.', ''],
      '5': ['What moves the price?', 'Acreage, how thick the trees are, stumps, how far the fill hauls, and how high the pad needs to be.', 'We’ll walk it and put it in writing.'],
      '6': ['Why don’t you run on wet ground?', 'It ruts your lot and makes a worse pad. When it’s too wet, we wait.', ''],
      '7': ['Mulching or clearing?', 'Mulching is fine for trails, pasture and views. A house pad needs the stumps and roots out.', '']
    };
    const n = tips[this.props.tip] ? this.props.tip : '1';
    const t = tips[n];
    return { n, q: t[0], a: t[1], extra: t[2], hasExtra: !!t[2], hasSource: n === '2' };
  }
}
</script>
</body>
</html>
