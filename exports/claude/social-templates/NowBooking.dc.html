<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now booking, portrait</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>body{margin:0;font-synthesis:none}</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; position: relative; overflow: hidden; padding: 80px; background: #120C06; color: #F9F7F4; font-family: 'Source Sans 3', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; gap: 32px">
  <svg aria-hidden="true" width="1080" height="1350" style="position: absolute; left: 0; top: 0; opacity: 0.06; pointer-events: none"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="1080" height="1350" filter="url(#grain)"></rect></svg>
  <sc-if value="{{ badged }}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; align-self: flex-start; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #2E1D10; border: 1px solid #E8A33D; border-radius: 2px; color: #E8A33D; font-weight: 700; font-size: 28px; letter-spacing: 0.04em; text-transform: uppercase"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24"><path fill="#E8A33D" d="M12 2 1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"></path></svg>Confirm before publishing: true at time of posting</div>
  </sc-if>
  <h1 style="position: relative; margin: 0; font-family: Graduate, 'Rockwell Extra Bold', Rockwell, serif; font-weight: 400; text-transform: uppercase; font-size: 88px; line-height: 1.1; color: #F9F7F4">{{ head }}</h1>
  <div style="position: relative; width: 160px; height: 4px; background: #A15C27"></div>
  <p style="position: relative; margin: 0; font-size: 40px; line-height: 1.4; color: #F9F7F4">Serving Hammond, Tangipahoa Parish &amp; the Northshore.</p>
  <p style="position: relative; margin: 0; font-size: 36px; line-height: 1.4; font-weight: 700; color: #C8783A">Book a Free Lot Walk · Call or Text 360-957-5865</p>
  <div style="position: relative; padding-top: 32px; font-size: 30px; color: #BFA89B">360-957-5865 · wrightco.llc</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"headline":{"editor":"enum","options":["Bought land? Let us walk it","Now booking lot walks"],"default":"Bought land? Let us walk it","section":"Content"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const nb = this.props.headline === 'Now booking lot walks';
    return { badged: nb, head: nb ? 'Now booking lot walks' : 'Bought land around Hammond? Let’s walk it.' };
  }
}
</script>
</body>
</html>
