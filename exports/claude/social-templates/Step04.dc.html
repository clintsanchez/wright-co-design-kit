<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 04 Foundation Dig, portrait</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>body{margin:0;font-synthesis:none}</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; position: relative; overflow: hidden; padding: 80px; background: #120C06; color: #F9F7F4; font-family: 'Source Sans 3', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between">
  <svg aria-hidden="true" width="1080" height="1350" style="position: absolute; left: 0; top: 0; opacity: 0.06; pointer-events: none"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="1080" height="1350" filter="url(#grain)"></rect></svg>
  <div style="position: relative; font-family: Graduate, 'Rockwell Extra Bold', Rockwell, serif; font-weight: 400; font-size: 240px; line-height: 1; color: #C8783A">04</div>
  <div style="position: relative; display: flex; flex-direction: column; gap: 32px">
    <h1 style="margin: 0; font-family: Graduate, 'Rockwell Extra Bold', Rockwell, serif; font-weight: 400; text-transform: uppercase; font-size: 88px; line-height: 1.1; color: #F9F7F4">Foundation dig</h1>
    <p style="margin: 0; font-size: 44px; line-height: 1.4; color: #F9F7F4">Dug the way your builder specifies, then handed off.</p>
    <div style="display: flex; flex-wrap: wrap; column-gap: 24px; row-gap: 8px; padding-top: 32px; border-top: 1px solid rgba(212,184,160,0.16)">
      <sc-for list="{{ strip }}" as="s" hint-placeholder-count="4">
        <sc-if value="{{ s.on }}" hint-placeholder-val="{{ false }}"><span style="font-family: Graduate, 'Rockwell Extra Bold', Rockwell, serif; font-weight: 400; text-transform: uppercase; font-size: 28px; letter-spacing: 0.08em; line-height: 1.4; color: #F9F7F4; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 8px">{{ s.label }}</span></sc-if>
        <sc-if value="{{ s.off }}" hint-placeholder-val="{{ true }}"><span style="font-family: Graduate, 'Rockwell Extra Bold', Rockwell, serif; font-weight: 400; text-transform: uppercase; font-size: 28px; letter-spacing: 0.08em; line-height: 1.4; color: #BFA89B">{{ s.label }}</span></sc-if>
      </sc-for>
    </div>
    <div style="font-size: 30px; color: #BFA89B">wrightco.llc</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = 3;
    const steps = ['01 Clear', '02 Driveway', '03 Pad', '04 Foundation Dig'];
    return { strip: steps.map((label, i) => ({ label, on: i === cur, off: i !== cur })) };
  }
}
</script>
</body>
</html>
