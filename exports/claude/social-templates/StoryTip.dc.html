<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story, Dirt Order tip cover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>body{margin:0;font-synthesis:none}</style>
</helmet>
<div style="width: 1080px; height: 1920px; box-sizing: border-box; position: relative; overflow: hidden; padding: 330px 80px 420px; background: #20150C; color: #F9F7F4; font-family: 'Source Sans 3', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: center; gap: 48px">
  <svg aria-hidden="true" width="1080" height="1920" style="position: absolute; left: 0; top: 0; opacity: 0.06; pointer-events: none"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="1080" height="1920" filter="url(#grain)"></rect></svg>
  <div style="position: relative; align-self: flex-start; background: #6F482A; padding: 3px; clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px)">
    <div style="background: #2E1D10; padding: 6px; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px)">
      <div style="border: 2px dashed #6F482A; padding: 12px 24px; font-family: Graduate, 'Rockwell Extra Bold', Rockwell, serif; font-weight: 400; text-transform: uppercase; font-size: 30px; letter-spacing: 0.08em; line-height: 1; color: #C8783A">Dirt Order #{{ n }}</div>
    </div>
  </div>
  <h1 style="position: relative; margin: 0; font-family: Graduate, 'Rockwell Extra Bold', Rockwell, serif; font-weight: 400; text-transform: uppercase; font-size: 88px; line-height: 1.1; color: #F9F7F4">{{ q }}</h1>
  <p style="position: relative; margin: 0; font-size: 44px; line-height: 1.4; color: #F9F7F4">{{ a }}</p>
  <div style="position: relative; font-size: 30px; color: #BFA89B">wrightco.llc</div>
  <sc-if value="{{ safe }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; top: 0; width: 1080px; height: 250px; box-sizing: border-box; background: rgba(232,163,61,0.18); border-bottom: 2px dashed #E8A33D; padding: 24px 40px; font-size: 28px; font-weight: 700; color: #E8A33D">Platform chrome, top 250 px: keep clear</div>
    <div style="position: absolute; left: 0; bottom: 0; width: 1080px; height: 340px; box-sizing: border-box; background: rgba(232,163,61,0.18); border-top: 2px dashed #E8A33D; padding: 24px 40px; font-size: 28px; font-weight: 700; color: #E8A33D">Captions and controls, bottom 340 px: keep clear</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tip":{"editor":"enum","options":["1","3","5","6","7"],"default":"3","section":"Content"},"safe":{"editor":"boolean","default":false,"section":"Guides"},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    const tips = {
      '1': ['What comes first?', 'In Tangipahoa it’s your 911 address, then the culvert permit, then us: clear, driveway, pad.'],
      '3': ['How high should my pad be?', 'Your surveyor and the parish set it. We build to it.'],
      '5': ['What moves the price?', 'Acreage, how thick the trees are, stumps, how far the fill hauls, and how high the pad needs to be.'],
      '6': ['Why don’t you run on wet ground?', 'It ruts your lot and makes a worse pad. When it’s too wet, we wait.'],
      '7': ['Mulching or clearing?', 'Mulching is fine for trails, pasture and views. A house pad needs the stumps and roots out.']
    };
    const n = tips[this.props.tip] ? this.props.tip : '3';
    return { n, q: tips[n][0], a: tips[n][1], safe: this.props.safe ?? false };
  }
}
</script>
</body>
</html>
